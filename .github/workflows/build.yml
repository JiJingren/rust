name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # cc-rs runs `xcrun --show-sdk-path` for every apple target while bootstrap
      # probes a C compiler for each entry in build.target
      # (src/bootstrap/src/utils/cc_detect.rs). There is no Xcode on Linux, so we
      # pre-set SDKROOT to an absolute, existing, non-root path, which makes
      # apple_sdk_root_inner() (cc-rs) return early without ever calling xcrun.
      # No C is actually compiled for the apple targets, so this is only used
      # for that early-exit.
      SDKROOT: /usr
      # sanity.rs checks every build.target against `stage0 --print target-list`.
      # The stage0 beta does not know the locally re-added `armv7-apple-ios`
      # target, so skip that check (stage 1 std is built by our own stage1
      # rustc, which does know it).
      BOOTSTRAP_SKIP_TARGET_SANITY: "1"

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          root-reserve-mb: 10240

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # actions/checkout passes `--depth=N` to `git submodule update` only
          # when fetch-depth > 0 (git-command-manager.ts:447). With
          # fetch-depth: 0 it clones EVERY submodule at full history, which is
          # what made this step take ~20 minutes. We only need 3 of them, so
          # init those ourselves below.
          submodules: false
          # llvm.download-ci-llvm resolves its artifact sha from HEAD^1 and
          # needs to walk history to find the upstream bors commit (see the
          # "single commit" step below), so the full history is required.
          fetch-depth: 0

      - name: Init the only submodules we need
        # Only these three are required:
        #   library/backtrace - always required (session.rs:432)
        #   src/tools/cargo   - tools = ["cargo"]
        #   src/llvm-project  - required by the default `rust-src` dist step
        # The doc books, rustc-perf, enzyme and gcc are not used
        # (docs = false, no Enzyme, no GCC backend). If bootstrap turns out to
        # need another one it will clone it itself via require_submodule.
        run: |
          git submodule sync
          for p in library/backtrace src/tools/cargo src/llvm-project; do
            git submodule update --init --depth 1 "$p" \
              || git submodule update --init --force "$p" \
              || true
          done
          git submodule status

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            cmake \
            git \
            python3 \
            curl \
            libssl-dev \
            pkg-config

      - name: Put all local changes into a single commit on top of upstream
        # `llvm.download-ci-llvm = true` builds its download URL from `HEAD^1`
        # (src/build_helper/src/git.rs get_closest_upstream_commit, CI branch).
        # HEAD^1 must therefore be a real rust-lang/rust commit that has a
        # `rust-dev-*` CI artifact, otherwise the download 404s. Collapsing all
        # local work into one commit on top of the newest upstream bors commit
        # guarantees that, without touching your pushed history (this is local
        # to the runner).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          UPSTREAM=$(git rev-list --first-parent -n1 --author=bors HEAD)
          if [ -z "$UPSTREAM" ]; then
            echo "::error::No upstream bors commit found in history. fetch-depth must be 0."
            exit 1
          fi
          echo "Upstream commit: $UPSTREAM"
          echo "                $(git log -1 --format=%s $UPSTREAM)"

          git reset --soft "$UPSTREAM"
          git commit --allow-empty -m "ci: iOS legacy toolchain build"

          echo "HEAD   = $(git rev-parse HEAD)"
          echo "HEAD^1 = $(git rev-parse HEAD^1)"

      - name: Set up Ninja execution environment
        run: |
          echo "NINJA_STATUS=[%f/%t %p %e] " >> $GITHUB_ENV

      - name: Generate bootstrap config.toml
        run: |
          cat << 'EOF' > config.toml
          change-id = "ignore"

          [llvm]
          download-ci-llvm = true

          [build]
          build = "x86_64-unknown-linux-gnu"
          host = ["x86_64-unknown-linux-gnu"]

          target = [
            "x86_64-unknown-linux-gnu",
            "armv7-apple-ios",
            "armv7s-apple-ios",
            "aarch64-apple-ios",
            "arm64e-apple-ios",
            "i386-apple-ios",
            "x86_64-apple-ios"
          ]

          description = "iOS-Legacy-Toolchain"
          docs = false
          extended = true
          tools = ["cargo", "rustfmt"]
          python = "python3"

          [rust]
          codegen-units = 0
          debug = false
          debug-assertions = false
          overflow-checks = false
          channel = "nightly"
          rpath = true

          [dist]
          src-tarball = false
          EOF

      - name: Build Rust Toolchain
        run: |
          CPU_CORES=$(nproc)
          echo "Building using ${CPU_CORES} threads..."
          # `--stage` must be given explicitly under CI, otherwise bootstrap
          # asserts that an implicit stage resolves to 2 (config.rs:1274-1286).
          # Stage 1 is not usable for `x dist`: dist::Extended::make_run uses
          # `top_stage - 1` (= 0) as its build compiler, so dist::Std would look
          # for a stage-0 std that is never built, and RustcPrivateCompilers
          # asserts `stage > 0`. Stage 2 is also what rust-lang CI uses.
          python3 src/bootstrap/bootstrap.py dist --stage 2 --jobs ${CPU_CORES}

      - name: Package Toolchain Artifacts
        run: |
          mkdir -p dist_output
          shopt -s nullglob
          for f in build/dist/*.tar.gz build/dist/*.tar.xz build/dist/*.tar.zst; do
            cp "$f" dist_output/
          done
          ls -la dist_output/

      - name: Upload Toolchain Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-ios-linux-x86_64
          path: dist_output/
          retention-days: 7
