name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # The prebuilt Darwin-flavored clang (iOSToolchain tarball) uses this
      # as its sysroot. It only has to exist by the time `x dist` runs -- the
      # job creates it below. (A plain `/usr` here used to make cc-rs skip
      # `xcrun`, but a real SDK gives us that for free: cc-rs returns early on
      # any existing, non-root path.)
      SDKROOT: ${{ github.workspace }}/iPhoneOS10.3.sdk
      # sanity.rs checks every build.target against `stage0 --print target-list`.
      # The stage0 beta does not know the locally re-added `armv7-apple-ios`
      # target, so skip that check (stage 1 std is built by our own stage1
      # rustc, which does know it).
      BOOTSTRAP_SKIP_TARGET_SANITY: "1"
      # maximize-build-space fills the root volume with LVM image files and
      # only leaves `root-reserve-mb` (10 GB) free on `/`, while it mounts the
      # big build volume over $GITHUB_WORKSPACE. Cargo's registry cache and
      # compiler temp files are by far the largest things a Rust build writes
      # outside of `build/`, so keep them on the build volume instead of the
      # root volume (whose free space is also needed by the runner's own
      # _diag/*.log files -- losing that is what kills the worker itself).
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      TMPDIR: ${{ github.workspace }}/.tmp

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          # The OS disk is 145G here (the action's README describes an older
          # 84G image), and the build volume it creates is currently ~100G --
          # far more than the ~40G a stage2 build ever peaks at, while `/`
          # was left with under 2G (10G reserve minus ~8G written on top).
          # Hand the balance back to `/`, which still has to host the runner's
          # _diag logs, /tmp and apt.
          root-reserve-mb: 40960

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # actions/checkout passes `--depth=N` to `git submodule update` only
          # when fetch-depth > 0 (git-command-manager.ts:447). With
          # fetch-depth: 0 it clones EVERY submodule at full history, which is
          # what made this step take ~20 minutes. We only need 3 of them, so
          # init those ourselves below.
          submodules: false
          # llvm.download-ci-llvm resolves its artifact sha from HEAD^1 and
          # needs to walk history to find the upstream bors commit (see the
          # "single commit" step below), so the full history is required.
          fetch-depth: 0

      - name: Prepare workspace dirs
        # Has to come after checkout: `actions/checkout` runs `git clean -ffdx`
        # (clean: true by default), which would delete anything created in the
        # workspace beforehand. These dirs live on the big build volume.
        run: |
          mkdir -p "$CARGO_HOME" "$TMPDIR"
          echo "=== disk after checkout ==="
          df -h

      - name: Init the only submodules we need
        # Only these three are required:
        #   library/backtrace - always required (session.rs:432)
        #   src/tools/cargo   - tools = ["cargo"]
        #   src/llvm-project  - required by the default `rust-src` dist step
        # The doc books, rustc-perf, enzyme and gcc are not used
        # (docs = false, no Enzyme, no GCC backend). If bootstrap turns out to
        # need another one it will clone it itself via require_submodule.
        run: |
          git submodule sync
          for p in library/backtrace src/tools/cargo src/llvm-project; do
            git submodule update --init --depth 1 "$p" \
              || git submodule update --init --force "$p" \
              || true
          done
          git submodule status

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            cmake \
            git \
            python3 \
            curl \
            libssl-dev \
            pkg-config
          # apt writes to the root volume, whose free space is capped at
          # root-reserve-mb -- drop its caches again right away.
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install iOS toolchain and SDK
        run: |
          # Linux GNU ld cannot produce Mach-O at all (it dies on Darwin link
          # args). Use the prebuilt Darwin-flavored clang/ld64 instead -- the
          # same tarball theos' own installer fetches, minus theos itself.
          mkdir -p "$GITHUB_WORKSPACE/.toolchain"
          curl -sL "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-$(uname -m).tar.xz" \
            | tar -xJvf - -C "$GITHUB_WORKSPACE/.toolchain/"
          CLANG="$GITHUB_WORKSPACE/.toolchain/linux/iphone/bin/clang"
          test -x "$CLANG"
          ls "$GITHUB_WORKSPACE/.toolchain/linux/iphone/bin"
          "$CLANG" --version

          # theos' iPhoneOS10.3 SDK is pure tbd stubs (1026 .tbd, 0 .dylib),
          # so there are no binary slices to be missing: libSystem.tbd lists
          # archs [ armv7, armv7s, arm64, i386, x86_64 ], covering the
          # simulator triples too. It does not list arm64e, so arm64e links
          # against 16.5 instead (see the rustflags below).
          curl -sL -o "$RUNNER_TEMP/ios-sdk.tar.xz" \
            "https://github.com/theos/sdks/releases/latest/download/iPhoneOS10.3.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/ios-sdk.tar.xz" -C "$GITHUB_WORKSPACE"
          test -d "$GITHUB_WORKSPACE/iPhoneOS10.3.sdk/usr"
          grep -m1 -E "^(archs|targets):" "$GITHUB_WORKSPACE/iPhoneOS10.3.sdk/usr/lib/libSystem.tbd"

          # theos dumped these tbd stubs from `nm` output and only kept
          # *defined* (T) symbols -- Apple's mem* entry points are *indirect*
          # symbols ("I _memmove (indirect for __platform_memmove)"), so they
          # are missing and ld64 reports them undefined while linking std.
          # Re-add them to exports[0] (archs covers every triple we build).
          python3 - <<'PY'
          import os, pathlib, re, yaml

          class L(yaml.SafeLoader):
              pass

          def tagged(loader, suffix, node):
              if isinstance(node, yaml.MappingNode):
                  return loader.construct_mapping(node)
              if isinstance(node, yaml.SequenceNode):
                  return loader.construct_sequence(node)
              return loader.construct_scalar(node)

          L.add_multi_constructor('!', tagged)

          PATCH = {
              'usr/lib/system/libsystem_c.tbd':
                  ['_memmove', '_memset', '_memcmp', '_memcpy'],
              'usr/lib/system/libsystem_platform.tbd':
                  ['_memset_pattern16'],
          }
          sdk = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'iPhoneOS10.3.sdk'
          for rel, syms in PATCH.items():
              p = sdk / rel
              t = p.read_text()
              d = yaml.load(re.sub(r'^--- !\S+', '---', t, flags=re.M), Loader=L)
              have = set()
              for e in d['exports']:
                  for v in e.values():
                      if isinstance(v, list):
                          have |= set(v)
              add = [s for s in syms if s not in have]
              if not add:
                  print(f'{rel}: already present')
                  continue
              i = t.index('symbols:')
              j = t.index('[', i)
              p.write_text(t[:j + 1] + ' ' + ', '.join(add) + ',' + t[j + 1:])
              d2 = yaml.load(re.sub(r'^--- !\S+', '---', p.read_text(), flags=re.M), Loader=L)
              for s in add:
                  assert s in d2['exports'][0]['symbols'], f'{s} missing after patch'
              print(f'{rel}: added {add} for archs={d["exports"][0]["archs"]}')
          PY

          # iOS 16.5: tbd-v4 targets [ armv7-ios, armv7s-ios, arm64-ios,
          # arm64e-ios ] -- the only source of arm64e stubs. No simulator
          # archs, hence the split.
          curl -sL -o "$RUNNER_TEMP/ios-sdk-165.tar.xz" \
            "https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/ios-sdk-165.tar.xz" -C "$GITHUB_WORKSPACE"
          test -d "$GITHUB_WORKSPACE/iPhoneOS16.5.sdk/usr"
          grep -m1 -E "^(archs|targets):" "$GITHUB_WORKSPACE/iPhoneOS16.5.sdk/usr/lib/libSystem.tbd"

      - name: Put all local changes into a single commit on top of upstream
        # `llvm.download-ci-llvm = true` builds its download URL from `HEAD^1`
        # (src/build_helper/src/git.rs get_closest_upstream_commit, CI branch).
        # HEAD^1 must therefore be a real rust-lang/rust commit that has a
        # `rust-dev-*` CI artifact, otherwise the download 404s. Collapsing all
        # local work into one commit on top of the newest upstream bors commit
        # guarantees that, without touching your pushed history (this is local
        # to the runner).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          UPSTREAM=$(git rev-list --first-parent -n1 --author=bors HEAD)
          if [ -z "$UPSTREAM" ]; then
            echo "::error::No upstream bors commit found in history. fetch-depth must be 0."
            exit 1
          fi
          echo "Upstream commit: $UPSTREAM"
          echo "                $(git log -1 --format=%s $UPSTREAM)"

          git reset --soft "$UPSTREAM"
          git commit --allow-empty -m "ci: iOS legacy toolchain build"

          echo "HEAD   = $(git rev-parse HEAD)"
          echo "HEAD^1 = $(git rev-parse HEAD^1)"

      - name: Set up Ninja execution environment
        run: |
          echo "NINJA_STATUS=[%f/%t %p %e] " >> $GITHUB_ENV

      - name: Generate bootstrap config.toml
        run: |
          cat << 'EOF' > config.toml
          change-id = "ignore"

          [llvm]
          download-ci-llvm = true

          [build]
          build = "x86_64-unknown-linux-gnu"
          host = ["x86_64-unknown-linux-gnu"]

          target = [
            "x86_64-unknown-linux-gnu",
            "armv7-apple-ios",
            "armv7s-apple-ios",
            "aarch64-apple-ios",
            "arm64e-apple-ios",
            "i386-apple-ios",
            "x86_64-apple-ios"
          ]

          description = "iOS-Legacy-Toolchain"
          docs = false
          extended = true
          tools = ["cargo", "rustfmt"]
          python = "python3"

          [rust]
          codegen-units = 0
          debug = false
          debug-assertions = false
          overflow-checks = false
          channel = "nightly"
          rpath = true

          [dist]
          src-tarball = false

          # Link the Apple targets with the Darwin-flavored clang instead of
          # whatever `cc` bootstrap finds (GNU ld cannot emit Mach-O). The
          # host target keeps the default linker. The github.workspace
          # expressions are expanded by Actions before this heredoc ever
          # reaches the shell.
          [target.armv7-apple-ios]
          linker = "${{ github.workspace }}/.toolchain/linux/iphone/bin/clang"

          [target.armv7s-apple-ios]
          linker = "${{ github.workspace }}/.toolchain/linux/iphone/bin/clang"

          [target.aarch64-apple-ios]
          linker = "${{ github.workspace }}/.toolchain/linux/iphone/bin/clang"

          [target.arm64e-apple-ios]
          linker = "${{ github.workspace }}/.toolchain/linux/iphone/bin/clang"
          rustflags = ["-C", "link-arg=-isysroot", "-C", "link-arg=${{ github.workspace }}/iPhoneOS16.5.sdk"]

          [target.i386-apple-ios]
          linker = "${{ github.workspace }}/.toolchain/linux/iphone/bin/clang"

          [target.x86_64-apple-ios]
          linker = "${{ github.workspace }}/.toolchain/linux/iphone/bin/clang"
          EOF

      - name: Build Rust Toolchain
        run: |
          # On any exit (including a failure) print the disk layout plus the
          # biggest consumers of the root volume, so a "No space left on
          # device" or a bare exit 1 tells us which volume filled up and why.
          trap 'echo "::group::Disk usage at exit"; df -h; sudo du -xh --max-depth=1 / 2>/dev/null | sort -rh | head -20; echo "::endgroup::"' EXIT
          CPU_CORES=$(nproc)
          echo "Building using ${CPU_CORES} threads..."
          echo "=== disk before build ==="
          df -h
          # `--stage` must be given explicitly under CI, otherwise bootstrap
          # asserts that an implicit stage resolves to 2 (config.rs:1274-1286).
          # Stage 1 is not usable for `x dist`: dist::Extended::make_run uses
          # `top_stage - 1` (= 0) as its build compiler, so dist::Std would look
          # for a stage-0 std that is never built, and RustcPrivateCompilers
          # asserts `stage > 0`. Stage 2 is also what rust-lang CI uses.
          python3 src/bootstrap/bootstrap.py dist --stage 2 --jobs ${CPU_CORES}

      - name: Package Toolchain Artifacts
        run: |
          mkdir -p dist_output
          shopt -s nullglob
          for f in build/dist/*.tar.gz build/dist/*.tar.xz build/dist/*.tar.zst; do
            cp "$f" dist_output/
          done
          ls -la dist_output/

      - name: Upload Toolchain Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-ios-linux-x86_64
          path: dist_output/
          retention-days: 7
